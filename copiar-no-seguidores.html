<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No-Seguidores PRO · Copiar</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    background: #0c0a14; color: #fff;
  }
  .bg { position: fixed; inset: 0; z-index: -1; filter: blur(70px); opacity: .85; }
  .bg span { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; animation: float 18s ease-in-out infinite alternate; }
  .bg span:nth-child(1) { background: #f58529; top: -12vmax; left: -10vmax; }
  .bg span:nth-child(2) { background: #dd2a7b; bottom: -16vmax; right: -8vmax; animation-delay: -6s; }
  .bg span:nth-child(3) { background: #515bd4; top: 30%; left: 40%; width: 34vmax; height: 34vmax; animation-delay: -12s; }
  @keyframes float { to { transform: translate(8vmax, -6vmax) scale(1.15); } }
  .grain { position: fixed; inset: 0; z-index: -1; background: radial-gradient(transparent 0, rgba(12,10,20,.55) 100%); }
  button {
    font: 600 22px/1 inherit; letter-spacing: .5px; color: #fff; cursor: pointer;
    padding: 22px 56px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.12); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s, background .2s, box-shadow .2s;
  }
  button:hover { background: rgba(255,255,255,.2); transform: translateY(-2px); box-shadow: 0 16px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3); }
  button:active { transform: scale(.97); }
  button.ok { background: rgba(34,197,94,.35); border-color: rgba(134,239,172,.6); }
  button.err { background: rgba(239,68,68,.35); border-color: rgba(252,165,165,.6); }
</style>
</head>
<body>
  <div class="bg"><span></span><span></span><span></span></div>
  <div class="grain"></div>
  <button id="copy">Copiar</button>

<script>
  const CODE = "/*!\n * No-Seguidores PRO — panel personal para la consola de instagram.com\n * ------------------------------------------------------------------\n * • Sin dependencias y sin peticiones a otros dominios: solo habla con\n *   www.instagram.com usando tu propia sesión.\n * • Todo se guarda en el localStorage de TU navegador, separado por cuenta.\n *\n * Funciones\n *   - Escaneo completo de seguidores / seguidos con reintentos y pausas.\n *   - Pestañas: No te siguen · No seguís (fans) · Dejaron de seguirte\n *     (comparando con el escaneo anterior) · Protegidos · Historial.\n *   - Búsqueda, filtros (verificados / privados / públicos) y orden.\n *   - Lista blanca (\"Protegidos\") con alta/baja individual.\n *   - Unfollow por lotes con límites, cuenta regresiva, barra de progreso,\n *     ETA y corte automático si Instagram empieza a limitar.\n *   - Historial de unfollows con botón \"Volver a seguir\".\n *   - Exportar CSV / JSON o copiar al portapapeles.\n *   - Panel arrastrable y minimizable (Shadow DOM, sin innerHTML con datos).\n *\n * Uso: abrí www.instagram.com logueado → F12 → Consola → pegá todo → Enter.\n * Nota: automatizar acciones va contra las condiciones de Instagram. Los\n * límites por defecto son conservadores; no los subas demasiado.\n */\n(() => {\n  'use strict';\n\n  // ───────────────────────── Comprobaciones iniciales ─────────────────────────\n  if (location.hostname !== 'www.instagram.com') {\n    alert('Abrí www.instagram.com (logueado) y volvé a pegar el script.');\n    return;\n  }\n  const prev = document.getElementById('nfx-host');\n  if (prev) { prev.style.display = ''; return; }\n\n  const getCookie = (name) => {\n    const hit = document.cookie.split('; ').find((c) => c.startsWith(name + '='));\n    return hit ? decodeURIComponent(hit.slice(name.length + 1)) : null;\n  };\n  const myId = getCookie('ds_user_id');\n  if (!myId) { alert('No encontré tu sesión. ¿Estás logueado en Instagram?'); return; }\n\n  // ───────────────────────────────── Config ─────────────────────────────────\n  const CFG = Object.freeze({\n    appId: '936619743392459',\n    pageSize: 50,\n    scanDelay: 1200,           // ms entre páginas\n    scanPauseEvery: 10,        // pausa extra cada N páginas\n    scanPause: 8000,           // ms de esa pausa\n    actionDelay: 8000,         // ms base entre acciones (+0–40 % al azar)\n    batchSize: 10,             // pausa larga cada N acciones\n    batchPause: 120000,        // ms de pausa larga\n    maxPerRun: 50,             // tope de unfollows por ejecución\n    maxConsecutiveErrors: 3,   // corta si falla N veces seguidas\n    freshScanMs: 2 * 3600e3,   // antigüedad máxima del escaneo para permitir unfollow\n    renderStep: 200,           // filas por tanda en la lista\n    historyMax: 1000,\n  });\n\n  // ──────────────────────────────── Utilidades ───────────────────────────────\n  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));\n  const jitter = (ms) => Math.round(ms + Math.random() * ms * 0.4);\n  const fmtNum = (n) => Number(n || 0).toLocaleString('es-AR');\n  const fmtDur = (ms) => {\n    const s = Math.max(0, Math.round(ms / 1000));\n    if (s < 60) return `${s} s`;\n    const m = Math.floor(s / 60), r = s % 60;\n    if (m < 60) return r ? `${m} min ${r} s` : `${m} min`;\n    return `${Math.floor(m / 60)} h ${m % 60} min`;\n  };\n  const timeAgo = (ts) => {\n    if (!ts) return 'nunca';\n    const d = Date.now() - ts;\n    if (d < 60e3) return 'recién';\n    if (d < 3600e3) return `hace ${Math.floor(d / 60e3)} min`;\n    if (d < 86400e3) return `hace ${Math.floor(d / 3600e3)} h`;\n    return `hace ${Math.floor(d / 86400e3)} días`;\n  };\n  const fmtDate = (ts) => new Date(ts).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });\n\n  // ─────────────────────────────── Almacenamiento ────────────────────────────\n  const NS = `nfx:v2:${myId}:`;\n  const store = {\n    get(key, def) {\n      try { const v = localStorage.getItem(NS + key); return v ? JSON.parse(v) : def; }\n      catch (_) { return def; }\n    },\n    set(key, val) {\n      try { localStorage.setItem(NS + key, JSON.stringify(val)); return true; }\n      catch (_) { return false; }\n    },\n  };\n\n  // Usuarios guardados de forma compacta: [id, username, full_name, flags]\n  const F_PRIV = 1, F_VER = 2;\n  const pack = (u) => [u.id, u.username, u.full_name, (u.is_private ? F_PRIV : 0) | (u.is_verified ? F_VER : 0)];\n  const unpack = (a) => ({ id: a[0], username: a[1], full_name: a[2] || '', is_private: !!(a[3] & F_PRIV), is_verified: !!(a[3] & F_VER) });\n  const normalize = (u) => ({\n    id: String(u.pk ?? u.pk_id ?? u.id),\n    username: u.username || '',\n    full_name: u.full_name || '',\n    is_private: !!u.is_private,\n    is_verified: !!u.is_verified,\n  });\n\n  function loadScan() {\n    const raw = store.get('scan', null);\n    if (!raw || !Array.isArray(raw.followers) || !Array.isArray(raw.following)) return null;\n    return {\n      ts: raw.ts,\n      followers: raw.followers.map(unpack),\n      following: raw.following.map(unpack),\n      lost: (raw.lost || []).map(unpack),\n      lostSince: raw.lostSince || null,\n    };\n  }\n  function saveScan() {\n    if (!S.scan) return;\n    const ok = store.set('scan', {\n      ts: S.scan.ts,\n      followers: S.scan.followers.map(pack),\n      following: S.scan.following.map(pack),\n      lost: S.scan.lost.map(pack),\n      lostSince: S.scan.lostSince,\n    });\n    if (!ok) log('⚠ No pude guardar el escaneo (localStorage lleno). Seguirá en memoria.');\n  }\n\n  function loadWhitelist() {\n    const wl = store.get('whitelist', {});\n    // Migración desde el script anterior (mnf_whitelist_v1: {id: username})\n    try {\n      const old = JSON.parse(localStorage.getItem('mnf_whitelist_v1') || 'null');\n      if (old && typeof old === 'object') {\n        for (const [id, username] of Object.entries(old)) if (!wl[id]) wl[id] = { username, ts: Date.now() };\n      }\n    } catch (_) { /* nada */ }\n    return wl;\n  }\n\n  // ──────────────────────────────────── API ──────────────────────────────────\n  class HttpError extends Error {\n    constructor(status, body) { super('HTTP ' + status); this.status = status; this.body = body; }\n  }\n\n  async function ig(path, { method = 'GET', body } = {}) {\n    const headers = {\n      'X-IG-App-ID': CFG.appId,\n      'X-Requested-With': 'XMLHttpRequest',\n      'X-CSRFToken': getCookie('csrftoken') || '',\n      Accept: '*/*',\n    };\n    if (body !== undefined) headers['Content-Type'] = 'application/x-www-form-urlencoded';\n    const res = await fetch('https://www.instagram.com' + path, { method, body, headers, credentials: 'same-origin' });\n    let data = null;\n    try { data = await res.json(); } catch (_) { /* sin JSON */ }\n    if (!res.ok || (data && data.status === 'fail')) throw new HttpError(res.status, data);\n    return data;\n  }\n\n  const isBlock = (e) =>\n    e instanceof HttpError &&\n    (e.status === 429 ||\n      /feedback_required|checkpoint|action_blocked|spam|try again later|wait a few minutes/i.test(JSON.stringify(e.body || '')));\n  const isAuth = (e) => e instanceof HttpError && (e.status === 401 || e.status === 403 || /login_required/i.test(JSON.stringify(e.body || '')));\n  const errText = (e) => (e && e.body && e.body.message) ? `${e.message} – ${e.body.message}` : (e && e.message) || String(e);\n\n  const api = {\n    page: (kind, maxId) =>\n      ig(`/api/v1/friendships/${myId}/${kind}/?count=${CFG.pageSize}` + (maxId ? `&max_id=${encodeURIComponent(maxId)}` : '')),\n    unfollow: (id) => ig(`/api/v1/friendships/destroy/${id}/`, { method: 'POST', body: `user_id=${id}` }),\n    follow: (id) => ig(`/api/v1/friendships/create/${id}/`, { method: 'POST', body: `user_id=${id}` }),\n  };\n\n  // ─────────────────────────────────── Estado ─────────────────────────────────\n  const S = {\n    busy: false,\n    stop: false,\n    tab: 'nf',\n    query: '',\n    filter: 'all',\n    sort: 'az',\n    limit: CFG.renderStep,\n    selected: new Set(),\n    scan: loadScan(),\n    whitelist: loadWhitelist(),     // {id: {username, ts}}\n    history: store.get('history', []), // [{id, username, ts, refollowed?}]\n    lists: { nf: [], fans: [], lost: [] },\n  };\n  const saveWhitelist = () => store.set('whitelist', S.whitelist);\n  const saveHistory = () => store.set('history', S.history.slice(0, CFG.historyMax));\n\n  function derive() {\n    if (!S.scan) { S.lists = { nf: [], fans: [], lost: [] }; return; }\n    const fIds = new Set(S.scan.followers.map((u) => u.id));\n    const gIds = new Set(S.scan.following.map((u) => u.id));\n    S.lists = {\n      nf: S.scan.following.filter((u) => !fIds.has(u.id)),\n      fans: S.scan.followers.filter((u) => !gIds.has(u.id)),\n      lost: S.scan.lost,\n    };\n  }\n  const scanIsFresh = () => !!(S.scan && Date.now() - S.scan.ts < CFG.freshScanMs);\n\n  // ────────────────────────────────── Escaneo ─────────────────────────────────\n  async function fetchAll(kind, label) {\n    const out = new Map();\n    let maxId = null, pages = 0;\n    for (;;) {\n      let data = null;\n      for (let attempt = 1; ; attempt++) {\n        if (S.stop) throw new Error('detenido por vos');\n        try { data = await api.page(kind, maxId); break; }\n        catch (e) {\n          if (isAuth(e)) throw new Error('la sesión no es válida (volvé a iniciar sesión)');\n          if (attempt >= 4) throw e;\n          const secs = (e.status === 429 ? 45 : 6) * attempt;\n          log(`Reintento ${attempt}/3 en ${secs} s (${errText(e)})`);\n          if (!(await countdown(secs * 1000, 'Esperando para reintentar'))) throw new Error('detenido por vos');\n        }\n      }\n      const users = data.users || [];\n      for (const u of users) { const n = normalize(u); out.set(n.id, n); }\n      setStatus(`${label}: ${fmtNum(out.size)}`);\n      if (!data.next_max_id || users.length === 0) break;\n      maxId = data.next_max_id;\n      pages++;\n      await sleep(jitter(CFG.scanDelay));\n      if (pages % CFG.scanPauseEvery === 0) {\n        if (!(await countdown(CFG.scanPause, `${label}: ${fmtNum(out.size)} · pausa de seguridad`))) throw new Error('detenido por vos');\n      }\n    }\n    return [...out.values()];\n  }\n\n  async function scan() {\n    if (S.busy) return;\n    setBusy(true);\n    setProgress(null);\n    const t0 = Date.now();\n    try {\n      log('Leyendo seguidores…');\n      const followers = await fetchAll('followers', 'Seguidores leídos');\n      log(`Seguidores: ${fmtNum(followers.length)}. Leyendo seguidos…`);\n      const following = await fetchAll('following', 'Seguidos leídos');\n\n      // Comparar con el escaneo anterior para detectar quién dejó de seguirte\n      let lost = S.scan ? S.scan.lost : [];\n      let lostSince = S.scan ? S.scan.lostSince : null;\n      if (S.scan) {\n        const now = new Set(followers.map((u) => u.id));\n        const fresh = S.scan.followers.filter((u) => !now.has(u.id));\n        if (fresh.length) {\n          const known = new Set(lost.map((u) => u.id));\n          lost = [...fresh.filter((u) => !known.has(u.id)), ...lost.filter((u) => !now.has(u.id))];\n          log(`📉 ${fresh.length} cuenta(s) dejaron de seguirte desde el ${fmtDate(S.scan.ts)}.`);\n        } else {\n          lost = lost.filter((u) => !now.has(u.id));\n        }\n        lostSince = lostSince || S.scan.ts;\n      }\n\n      S.scan = { ts: Date.now(), followers, following, lost, lostSince };\n      saveScan();\n      derive();\n      S.selected.clear();\n      log(`✔ Escaneo completo en ${fmtDur(Date.now() - t0)}: ${fmtNum(S.lists.nf.length)} no te siguen de vuelta.`);\n      setStatus(`Escaneo completo · ${fmtNum(S.lists.nf.length)} no te siguen`);\n    } catch (e) {\n      log('✖ Escaneo interrumpido: ' + errText(e) + '. Se conservan los datos anteriores.');\n      setStatus('Escaneo incompleto');\n    } finally {\n      setBusy(false);\n      setProgress(0);\n      render();\n    }\n  }\n\n  // ───────────────────────────────── Acciones ─────────────────────────────────\n  async function countdown(ms, label) {\n    const end = Date.now() + ms;\n    while (Date.now() < end) {\n      if (S.stop) return false;\n      setStatus(`${label} · ${fmtDur(end - Date.now())}`);\n      await sleep(Math.min(1000, end - Date.now()));\n    }\n    return !S.stop;\n  }\n\n  async function runUnfollow() {\n    if (S.busy) return;\n    if (!scanIsFresh()) { alert('El escaneo tiene más de 2 h. Volvé a escanear antes de dejar de seguir.'); return; }\n    const targets = S.lists.nf.filter((u) => S.selected.has(u.id) && !S.whitelist[u.id]).slice(0, CFG.maxPerRun);\n    if (!targets.length) { alert('No hay cuentas seleccionadas.'); return; }\n    const eta = targets.length * CFG.actionDelay * 1.2 + Math.floor((targets.length - 1) / CFG.batchSize) * CFG.batchPause;\n    if (!confirm(`¿Dejar de seguir a ${targets.length} cuenta(s)?\\n\\nTiempo estimado: ~${fmtDur(eta)}\\nTope por ejecución: ${CFG.maxPerRun}`)) return;\n\n    setBusy(true);\n    let done = 0, consecutiveErrors = 0;\n    const t0 = Date.now();\n    for (let i = 0; i < targets.length; i++) {\n      if (S.stop) { log('Detenido por vos.'); break; }\n      const u = targets[i];\n      try {\n        await api.unfollow(u.id);\n        done++; consecutiveErrors = 0;\n        S.scan.following = S.scan.following.filter((x) => x.id !== u.id);\n        S.selected.delete(u.id);\n        S.history.unshift({ id: u.id, username: u.username, ts: Date.now() });\n        log(`✔ Dejaste de seguir a @${u.username} (${i + 1}/${targets.length})`);\n      } catch (e) {\n        consecutiveErrors++;\n        log(`✖ @${u.username}: ${errText(e)}`);\n        if (isBlock(e) || isAuth(e)) {\n          log('⚠ Instagram está limitando la cuenta. Corto acá; esperá varias horas (idealmente 24 h).');\n          break;\n        }\n        if (consecutiveErrors >= CFG.maxConsecutiveErrors) {\n          log(`⚠ ${consecutiveErrors} errores seguidos. Corto por seguridad.`);\n          break;\n        }\n      }\n      setProgress((i + 1) / targets.length);\n      derive(); renderList(); renderStats();\n      if (i === targets.length - 1) break;\n\n      const elapsed = Date.now() - t0;\n      const remaining = (elapsed / (i + 1)) * (targets.length - i - 1);\n      const isBatchEnd = (i + 1) % CFG.batchSize === 0;\n      const ok = await countdown(\n        isBatchEnd ? CFG.batchPause : jitter(CFG.actionDelay),\n        `${i + 1}/${targets.length} · ${isBatchEnd ? 'pausa larga' : 'próxima'} · ETA ~${fmtDur(remaining)}`\n      );\n      if (!ok) { log('Detenido por vos.'); break; }\n    }\n    saveScan(); saveHistory();\n    setBusy(false);\n    setStatus(`Terminado: ${done} unfollow(s) en ${fmtDur(Date.now() - t0)}`);\n    render();\n  }\n\n  async function refollow(entry) {\n    if (S.busy) return;\n    if (!confirm(`¿Volver a seguir a @${entry.username}?`)) return;\n    setBusy(true);\n    try {\n      await api.follow(entry.id);\n      entry.refollowed = Date.now();\n      saveHistory();\n      log(`✔ Volviste a seguir a @${entry.username}` + (entry.is_private ? ' (solicitud enviada)' : ''));\n    } catch (e) {\n      log(`✖ No pude seguir a @${entry.username}: ${errText(e)}`);\n    } finally { setBusy(false); render(); }\n  }\n\n  function protect(ids) {\n    const byId = new Map(S.lists.nf.map((u) => [u.id, u]));\n    let n = 0;\n    for (const id of ids) {\n      const u = byId.get(id);\n      if (u && !S.whitelist[id]) { S.whitelist[id] = { username: u.username, ts: Date.now() }; n++; }\n      S.selected.delete(id);\n    }\n    saveWhitelist();\n    if (n) log(`★ ${n} cuenta(s) agregadas a Protegidos.`);\n    render();\n  }\n\n  function unprotect(id) {\n    const name = S.whitelist[id] && S.whitelist[id].username;\n    delete S.whitelist[id];\n    saveWhitelist();\n    log(`☆ @${name} ya no está protegida.`);\n    render();\n  }\n\n  // ───────────────────────────────── Exportar ─────────────────────────────────\n  function download(name, text, type) {\n    const url = URL.createObjectURL(new Blob([text], { type }));\n    const a = Object.assign(document.createElement('a'), { href: url, download: name });\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n  }\n  const csvCell = (v) => `\"${String(v ?? '').replace(/\"/g, '\"\"')}\"`;\n  function exportCurrent(fmt) {\n    const rows = viewRows();\n    if (!rows.length) { log('No hay nada para exportar en esta pestaña.'); return; }\n    const stamp = new Date().toISOString().slice(0, 10);\n    const base = `instagram-${TABS[S.tab].file}-${stamp}`;\n    if (fmt === 'json') {\n      download(base + '.json', JSON.stringify(rows, null, 2), 'application/json');\n    } else {\n      const cols = ['username', 'full_name', 'id', 'is_private', 'is_verified', 'url'];\n      const lines = [cols.join(',')].concat(\n        rows.map((r) => cols.map((c) => csvCell(c === 'url' ? `https://www.instagram.com/${r.username}/` : r[c])).join(','))\n      );\n      download(base + '.csv', '﻿' + lines.join('\\r\\n'), 'text/csv;charset=utf-8');\n    }\n    log(`⬇ Exportadas ${rows.length} filas (${fmt.toUpperCase()}).`);\n  }\n  async function copyCurrent() {\n    const text = viewRows().map((u) => u.username).join('\\n');\n    try { await navigator.clipboard.writeText(text); log('Lista copiada al portapapeles.'); }\n    catch (_) { log('No pude copiar al portapapeles (probá con Exportar).'); }\n  }\n\n  // ─────────────────────────────────── Vistas ─────────────────────────────────\n  const TABS = {\n    nf:   { label: 'No te siguen',   file: 'no-te-siguen',        empty: 'Nadie por acá. Escaneá para empezar.' },\n    fans: { label: 'No seguís',      file: 'no-seguis',           empty: 'Seguís a todos los que te siguen.' },\n    lost: { label: 'Te dejaron',     file: 'dejaron-de-seguirte', empty: 'Sin cambios desde el escaneo anterior (se detecta a partir del 2.º escaneo).' },\n    wl:   { label: 'Protegidos',     file: 'protegidos',          empty: 'No protegiste ninguna cuenta. Usá ★ en la lista.' },\n    hist: { label: 'Historial',      file: 'historial',           empty: 'Todavía no dejaste de seguir a nadie con este panel.' },\n  };\n\n  function baseRows() {\n    switch (S.tab) {\n      case 'nf': return S.lists.nf.filter((u) => !S.whitelist[u.id]);\n      case 'fans': return S.lists.fans;\n      case 'lost': return S.lists.lost;\n      case 'wl': {\n        const known = new Map((S.scan ? S.scan.following : []).map((u) => [u.id, u]));\n        return Object.entries(S.whitelist).map(([id, w]) =>\n          known.get(id) || { id, username: w.username, full_name: '', is_private: false, is_verified: false });\n      }\n      case 'hist': return S.history.map((h) => ({ full_name: '', is_private: false, is_verified: false, ...h }));\n      default: return [];\n    }\n  }\n\n  function viewRows() {\n    const q = S.query.trim().toLowerCase();\n    let rows = baseRows().filter((u) =>\n      (!q || u.username.toLowerCase().includes(q) || (u.full_name || '').toLowerCase().includes(q)) &&\n      (S.filter === 'all' ||\n        (S.filter === 'verified' && u.is_verified) ||\n        (S.filter === 'private' && u.is_private) ||\n        (S.filter === 'public' && !u.is_private)));\n    if (S.tab !== 'hist') {\n      rows = rows.slice().sort((a, b) => a.username.localeCompare(b.username));\n      if (S.sort === 'za') rows.reverse();\n    }\n    return rows;\n  }\n\n  // ──────────────────────────────── Interfaz ─────────────────────────────────\n  const host = document.createElement('div');\n  host.id = 'nfx-host';\n  const root = host.attachShadow({ mode: 'open' });\n\n  const css = document.createElement('style');\n  css.textContent = `\n    :host { all: initial; }\n    * { box-sizing: border-box; }\n    .panel { position: fixed; top: 16px; right: 16px; width: 420px; max-height: calc(100vh - 32px);\n     ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }

  btn.addEventListener('click', async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(CODE); ok = true; }
    catch (_) { try { ok = fallbackCopy(CODE); } catch (_) { ok = false; } }
    clearTimeout(timer);
    btn.className = ok ? 'ok' : 'err';
    btn.textContent = ok ? '¡Copiado!' : 'No se pudo copiar';
    timer = setTimeout(() => { btn.className = ''; btn.textContent = 'Copiar'; }, 1800);
  });
</script>
</body>
</html>
