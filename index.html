  .wall div:nth-child(2n) { margin-left: -12vmax; }
  .wall b { color: rgba(141,22,24,.55); font-weight: 900; }
  .wall img { height: 2.4em; width: auto; vertical-align: middle; margin: 0 1.2em; opacity: .22; }
  .wall b.big { font-size: 2.4em; letter-spacing: 6px; color: transparent; -webkit-text-stroke: 1.5px rgba(141,22,24,.6); }
  .shade { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 42vmin 52vmin at 50% 50%, #000 55%, rgba(0,0,0,.85) 72%, transparent 100%); }
  .stage { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 5vmin; }
  .logo { width: min(58vmin, 440px); aspect-ratio: 1; display: block; user-select: none; -webkit-user-drag: none; }

  button {
    font: inherit; font-weight: 900; font-size: 20px; letter-spacing: 4px; text-transform: uppercase; line-height: 1;
    color: #0b0b0b; background: #f3efc4; cursor: pointer;
    padding: 18px 52px; border: 4px solid #8d1618; border-radius: 999px;
    transition: transform .15s, background .2s, color .2s;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: scale(.96); }
  button.ok  { background: #8d1618; color: #f3efc4; }
  button.err { background: #333; color: #f3efc4; border-color: #555; }

</style>
</head>

          const img = document.createElement('img'); img.alt = ''; img.draggable = false; img.src = LOGO_VL;
          row.append(b, img);
        }
      } else {
        const pool = r % 2 ? VL : IX;
        for (let k = 0; k < 14; k++) {
          const t = pool[Math.floor(rnd() * pool.length)];
          if (rnd() < .18) { const b = document.createElement('b'); b.textContent = t; row.append(b); }
          else row.append(t);
          row.append('  •  ');
        }
      }
      wall.append(row);
    }
  })();
</script>

<script>
  const CODE = "/*!\n * Instagram Not Followers — panel personal para la consola de instagram.com\n * ------------------------------------------------------------------\n * • Sin dependencias. Solo habla con www.instagram.com usando tu propia\n *   sesión; las fotos de perfil se cargan del propio CDN de Instagram.\n * • Todo se guarda en el localStorage de TU navegador, separado por cuenta.\n *\n * Funciones\n *   - Escaneo completo de seguidores / seguidos con reintentos y pausas.\n *   - Pestañas: No te siguen · Protegidos. Las cuentas que te dejaron de\n *     seguir desde el escaneo anterior se marcan con una etiqueta roja.\n *   - Búsqueda, filtros (verificados / privados / públicos) y orden.\n *   - Lista blanca (\"Protegidos\") con alta/baja individual.\n *   - Unfollow por lotes con límite por vez y por día, cuenta regresiva, barra,\n *     ETA y corte automático si Instagram empieza a limitar.\n *   - Exportar CSV / JSON o copiar al portapapeles.\n *   - Pantalla completa con tarjetas y foto de perfil de cada cuenta, o\n *     modo ventana arrastrable y minimizable (Shadow DOM, sin innerHTML).\n *\n * Uso: abrí www.instagram.com logueado → F12 → Consola → pegá todo → Enter.\n * Nota: automatizar acciones va contra las condiciones de Instagram. Los\n * límites por defecto son conservadores; no los subas demasiado.\n */\n(() => {\n  'use strict';\n\n  // ───────────────────────── Comprobaciones iniciales ─────────────────────────\n  if (location.hostname !== 'www.instagram.com') {\n    alert('Abrí www.instagram.com (logueado) y volvé a pegar el script.');\n    return;\n  }\n  const prev = document.getElementById('nfx-host');\n  if (prev) { prev.style.display = ''; return; }\n\n  const getCookie = (name) => {\n    const hit = document.cookie.split('; ').find((c) => c.startsWith(name + '='));\n    return hit ? decodeURIComponent(hit.slice(name.length + 1)) : null;\n  };\n  const myId = getCookie('ds_user_id');\n  if (!myId) { alert('No encontré tu sesión. ¿Estás logueado en Instagram?'); return; }\n\n  // ───────────────────────────────── Config ─────────────────────────────────\n  const CFG = Object.freeze({\n    appId: '936619743392459',\n    pageSize: 50,\n    scanDelay: 900,            // ms entre páginas\n    scanPauseEvery: 12,        // pausa extra cada N páginas\n    scanPause: 5000,           // ms de esa pausa\n    scanCooldown: 10 * 60e3,   // tiempo mínimo recomendado entre escaneos\n    limitCooldown: 60 * 60e3,  // espera recomendada si Instagram limitó (429)\n    actionDelay: 8000,         // ms base entre acciones (+0–40 % al azar)\n    batchSize: 10,             // pausa larga cada N acciones\n    batchPause: 120000,        // ms de pausa larga\n    maxPerRun: 50,             // tope de unfollows por ejecución\n    dailyMax: 120,             // tope de unfollows por día (se cuenta en este navegador)\n    maxConsecutiveErrors: 3,   // corta si falla N veces seguidas\n    freshScanMs: 2 * 3600e3,   // antigüedad máxima del escaneo para permitir unfollow\n    renderStep: 200,           // filas por tanda en la lista\n    historyMax: 1000,\n  });\n\n  // ──────────────────────────────── Utilidades ───────────────────────────────\n  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));\n  const jitter = (ms) => Math.round(ms + Math.random() * ms * 0.4);\n  const fmtNum = (n) => Number(n || 0).toLocaleString('es-AR');\n  const fmtDur = (ms) => {\n    const s = Math.max(0, Math.round(ms / 1000));\n    if (s < 60) return `${s} s`;\n    const m = Math.floor(s / 60), r = s % 60;\n    if (m < 60) return r ? `${m} min ${r} s` : `${m} min`;\n    return `${Math.floor(m / 60)} h ${m % 60} min`;\n  };\n  const timeAgo = (ts) => {\n    if (!ts) return 'nunca';\n    const d = Date.now() - ts;\n    if (d < 60e3) return 'recién';\n    if (d < 3600e3) return `hace ${Math.floor(d / 60e3)} min`;\n    if (d < 86400e3) return `hace ${Math.floor(d / 3600e3)} h`;\n    return `hace ${Math.floor(d / 86400e3)} días`;\n  };\n  const fmtDate = (ts) => new Date(ts).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });\n\n  // ─────────────────────────────── Almacenamiento ────────────────────────────\n  const NS = `nfx:v2:${myId}:`;\n  const store = {\n    get(key, def) {\n      try { const v = localStorage.getItem(NS + key); return v ? JSON.parse(v) : def; }\n      catch (_) { return def; }\n    },\n    set(key, val) {\n      try { localStorage.setItem(NS + key, JSON.stringify(val)); return true; }\n      catch (_) { return false; }\n    },\n  };\n\n  // Usuarios guardados de forma compacta: [id, username, full_name, flags]\n  const F_PRIV = 1, F_VER = 2;\n  const pack = (u) => [u.id, u.username, u.full_name, (u.is_private ? F_PRIV : 0) | (u.is_verified ? F_VER : 0), u.pic || ''];\n  const unpack = (a) => ({ id: a[0], username: a[1], full_name: a[2] || '', is_private: !!(a[3] & F_PRIV), is_verified: !!(a[3] & F_VER), pic: a[4] || '' });\n  const normalize = (u) => ({\n    id: String(u.pk ?? u.pk_id ?? u.id),\n    username: u.username || '',\n    full_name: u.full_name || '',\n    is_private: !!u.is_private,\n    is_verified: !!u.is_verified,\n    pic: u.profile_pic_url || '',\n  });\n\n  function loadScan() {\n    const raw = store.get('scan', null);\n    if (!raw || !Array.isArray(raw.followers) || !Array.isArray(raw.following)) return null;\n    return {\n      ts: raw.ts,\n      followers: raw.followers.map(unpack),\n      following: raw.following.map(unpack),\n      lost: (raw.lost || []).map(unpack),\n      lostSince: raw.lostSince || null,\n    };\n  }\n  function saveScan() {\n    if (!S.scan) return;\n    const noPic = (u) => pack({ ...u, pic: '' });\n    // Las fotos se guardan solo de los que seguís (ahí están los que no te siguen); así ocupa mucho menos\n    const build = (p) => ({\n      ts: S.scan.ts,\n      followers: S.scan.followers.map(noPic),\n      following: S.scan.following.map(p),\n      lost: S.scan.lost.map(p),\n      lostSince: S.scan.lostSince,\n    });\n    if (store.set('scan', build(pack))) return;\n    // Si no entra con las fotos, se guarda sin ellas (se ven igual mientras el panel esté abierto)\n    if (store.set('scan', build((u) => pack({ ...u, pic: '' })))) {\n      log('ℹ No había lugar para guardar las fotos: se ven ahora, pero al reabrir el panel tocá Re-escanear.');\n      return;\n    }\n    log('⚠ No pude guardar el escaneo (localStorage lleno). Seguirá en memoria.');\n  }\n\n  function loadWhitelist() {\n    const wl = store.get('whitelist', {});\n    // Migración desde el script anterior (mnf_whitelist_v1: {id: username})\n    try {\n      const old = JSON.parse(localStorage.getItem('mnf_whitelist_v1') || 'null');\n      if (old && typeof old === 'object') {\n        for (const [id, username] of Object.entries(old)) if (!wl[id]) wl[id] = { username, ts: Date.now() };\n      }\n    } catch (_) { /* nada */ }\n    return wl;\n  }\n\n  // ──────────────────────────────────── API ──────────────────────────────────\n  class HttpError extends Error {\n    constructor(status, body) { super('HTTP ' + status); this.status = status; this.body = body; }\n  }\n\n  async function ig(path, { method = 'GET', body } = {}) {\n    const headers = {\n      'X-IG-App-ID': CFG.appId,\n      'X-Requested-With': 'XMLHttpRequest',\n      'X-CSRFToken': getCookie('csrftoken') || '',\n      Accept: '*/*',\n    };\n    if (body !== undefined) headers['Content-Type'] = 'application/x-www-form-urlencoded';\n    const res = await fetch('https://www.instagram.com' + path, { method, body, headers, credentials: 'same-origin' });\n    let data = null;\n    try { data = await res.json(); } catch (_) { /* sin JSON */ }\n    if (!res.ok || (data && data.status === 'fail')) throw new HttpError(res.status, data);\n    return data;\n  }\n\n  const isBlock = (e) =>\n    e instanceof HttpError &&\n    (e.status === 429 ||\n      /feedback_required|checkpoint|action_blocked|spam|try again later|wait a few minutes/i.test(JSON.stringify(e.body || '')));\n  const isAuth = (e) => e instanceof HttpError && (e.status === 401 || e.status === 403 || /login_required/i.test(JSON.stringify(e.body || '')));\n  const errText = (e) => (e && e.body && e.body.message) ? `${e.message} – ${e.body.message}` : (e && e.message) || String(e);\n\n  const api = {\n    page: (kind, maxId) =>\n      ig(`/api/v1/friendships/${myId}/${kind}/?count=${CFG.pageSize}` + (maxId ? `&max_id=${encodeURIComponent(maxId)}` : '')),\n    unfollow: (id) => ig(`/api/v1/friendships/destroy/${id}/`, { method: 'POST', body: `user_id=${id}` }),\n    follow: (id) => ig(`/api/v1/friendships/create/${id}/`, { method: 'POST', body: `user_id=${id}` }),\n  };\n\n  // ─────────────────────────────────── Estado ─────────────────────────────────\n  const S = {\n    busy: false,\n    stop: false,\n    tab: 'nf',\n    query: '',\n    filter: 'all',\n    sort: 'az',\n    limit: CFG.renderStep,\n    selected: new Set(),\n    scan: loadScan(),\n    whitelist: loadWhitelist(),     // {id: {username, ts}}\n    history: store.get('history', []), // [{id, username, ts, refollowed?}]\n    lists: { nf: [], fans: [], lost: [] },\n  };\n  const saveWhitelist = () => store.set('whitelist', S.whitelist);\n  const saveHistory = () => store.set('history', S.history.slice(0, CFG.historyMax));\n  const today = () => new Date().toLocaleDateString('sv');\n  const dailyUsed = () => { const d = store.get('daily', null); return d && d.day === today() ? d.n : 0; };\n  const dailyAdd = () => store.set('daily', { day: today(), n: dailyUsed() + 1 });\n\n  function derive() {\n    if (!S.scan) { S.lists = { nf: [], fans: [], lost: [] }; return; }\n    const fIds = new Set(S.scan.followers.map((u) => u.id));\n    const gIds = new Set(S.scan.following.map((u) => u.id));\n    S.lists = {\n      nf: S.scan.following.filter((u) => !fIds.has(u.id)),\n      fans: S.scan.followers.filter((u) => !gIds.has(u.id)),\n      lost: S.scan.lost,\n    };\n  }\n  const scanIsFresh = () => !!(S.scan && Date.now() - S.scan.ts < CFG.freshScanMs);\n\n  // ────────────────────────────────── Escaneo ─────────────────────────────────\n  async function fetchAll(kind, label) {\n    const out = new Map();\n    let maxId = null, pages = 0;\n    for (;;) {\n      let data = null;\n      for (let attempt = 1; ; attempt++) {\n        if (S.stop) throw new Error('detenido por vos');\n        try { data = await api.page(kind, maxId); break; }\n        catch (e) {\n          if (isAuth(e)) throw new Error('la sesión no es válida (volvé a iniciar sesión)');\n          if (e.status === 429 && attempt >= 2) {\n            store.set('limitedAt', Date.now());\n            throw new Error('Instagram limitó las consultas por un rato (HTTP 429)');\n          }\n          if (attempt >= 4) throw e;\n          const secs = e.status === 429 ? 60 : 6 * attempt;\n          log(e.status === 429\n            ? `⏸ Instagram pidió frenar (HTTP 429). Espero ${secs} s y pruebo una sola vez más…`\n            : `Reintento ${attempt}/3 en ${secs} s (${errText(e)})`);\n          if (!(await countdown(secs * 1000, 'Esperando para reintentar'))) throw new Error('detenido por vos');\n        }\n      }\n      const users = data.users || [];\n      for (const u of users) { const n = normalize(u); out.set(n.id, n); }\n      setStatus(`${label}: ${fmtNum(out.size)}`);\n      if (!data.next_max_id || users.length === 0) break;\n      maxId = data.next_max_id;\n      pages++;\n      await sleep(jitter(CFG.scanDelay));\n      if (pages % CFG.scanPauseEvery === 0) {\n        if (!(await countdown(CFG.scanPause, `${label}: ${fmtNum(out.size)} · pausa de seguridad`))) throw new Error('detenido por vos');\n      }\n    }\n    return [...out.values()];\n  }\n\n  async function scan() {\n    if (S.busy) return;\n    const limitedAt = store.get('limitedAt', 0);\n    if (Date.now() - limitedAt < CFG.limitCooldown) {\n      const falta = fmtDur(CFG.limitCooldown - (Date.now() - limitedAt));\n      if (!confirm(`Instagram te limitó las consultas hace poco.\\nConviene esperar ~${falta} más; si insistís, el bloqueo puede durar más.\\n\\n¿Escanear igual?`)) return;\n    } else if (S.scan && Date.now() - S.scan.ts < CFG.scanCooldown) {\n      if (!confirm(`Escaneaste ${timeAgo(S.scan.ts)}. Escanear muy seguido hace que Instagram te limite.\\n\\n¿Escanear igual?`)) return;\n    }\n    setBusy(true);\n    setProgress(null);\n    const t0 = Date.now();\n    try {\n      log('Leyendo seguidores…');\n      const followers = await fetchAll('followers', 'Seguidores leídos');\n      log(`Seguidores: ${fmtNum(followers.length)}. Leyendo seguidos…`);\n      const following = await fetchAll('following', 'Seguidos leídos');\n\n      // Comparar con el escaneo anterior para detectar quién dejó de seguirte\n      let lost = S.scan ? S.scan.lost : [];\n      let lostSince = S.scan ? S.scan.lostSince : null;\n      if (S.scan) {\n        const now = new Set(followers.map((u) => u.id));\n        const fresh = S.scan.followers.filter((u) => !now.has(u.id));\n        if (fresh.length) {\n          const known = new Set(lost.map((u) => u.id));\n          lost = [...fresh.filter((u) => !known.has(u.id)), ...lost.filter((u) => !now.has(u.id))];\n          log(`📉 ${fresh.length} cuenta(s) dejaron de seguirte desde el escaneo del ${fmtDate(S.scan.ts)}`);\n        } else {\n          lost = lost.filter((u) => !now.has(u.id));\n        }\n        lostSince = lostSince || S.scan.ts;\n      }\n\n      S.scan = { ts: Date.now(), followers, following, lost, lostSince };\n      store.set('limitedAt', 0);\n      saveScan();\n      derive();\n      S.selected.clear();\n      const nNf = S.lists.nf.filter((u) => !S.whitelist[u.id]).length;\n      const nWl = S.lists.nf.length - nNf;\n      const extra = nWl ? ` (+${nWl} protegida${nWl > 1 ? 's' : ''})` : '';\n      log(`✔ Escaneo completo en ${fmtDur(Date.now() - t0)}: ${fmtNum(nNf)} no te siguen de vuelta${extra}.`);\n      setStatus(`Escaneo completo · ${fmtNum(nNf)} no te siguen${extra}`);\n    } catch (e) {\n      log('✖ Escaneo interrumpido: ' + errText(e) + '. Se conservan los datos anteriores.');\n      if (/429/.test(errText(e))) {\n        log('ℹ No es un baneo: es un límite temporal para leer listas. Esperá al menos 1 hora sin escanear (mejor 2–3 h).');\n        log('ℹ Mientras tanto podés ver el último escaneo guardado. No uses \"Dejar de seguir\" hasta que se pase.');\n      }\n      setStatus('Escaneo incompleto');\n    } finally {\n      setBusy(false);\n      setProgress(0);\n      render();\n    }\n  }\n\n  // ───────────────────────────────── Acciones ─────────────────────────────────\n  async function countdown(ms, label) {\n    const end = Date.now() + ms;\n    while (Date.now() < end) {\n      if (S.stop) return false;\n      setStatus(`${label} · ${fmtDur(end - Date.now())}`);\n      await sleep(Math.min(1000, end - Date.now()));\n    }\n    return !S.stop;\n  }\n\n  async function runUnfollow() {\n    if (S.busy) return;\n    if (!scanIsFresh()) { alert('El escaneo tiene más de 2 h. Volvé a escanear antes de dejar de seguir.'); return; }\n    if (Date.now() - store.get('limitedAt', 0) < CFG.limitCooldown) {\n      alert('Instagram te limitó hace poco. Esperá un rato antes de dejar de seguir, así no se agrava.'); return;\n    }\n    const left = CFG.dailyMax - dailyUsed();\n    if (left <= 0) { alert(`Ya llegaste al tope de ${CFG.dailyMax} unfollows por hoy. Seguí mañana para cuidar la cuenta.`); return; }\n    const targets = S.lists.nf.filter((u) => S.selected.has(u.id) && !S.whitelist[u.id]).slice(0, Math.min(CFG.maxPerRun, left));\n    if (!targets.length) { alert('No hay cuentas seleccionadas.'); return; }\n    const eta = targets.length * CFG.actionDelay * 1.2 + Math.floor((targets.length - 1) / CFG.batchSize) * CFG.batchPause;\n    if (!confirm(`¿Dejar de seguir a ${targets.length} cuenta(s)?\\n\\nTiempo estimado: ~${fmtDur(eta)}\\nHoy te quedan ${left} de ${CFG.dailyMax}.`)) return;\n\n    setBusy(true);\n    let done = 0, consecutiveErrors = 0;\n    const t0 = Date.now();\n    for (let i = 0; i < targets.length; i++) {\n      if (S.stop) { log('Detenido por vos.'); break; }\n      const u = targets[i];\n      try {\n        await api.unfollow(u.id);\n        done++; consecutiveErrors = 0; dailyAdd();\n        S.scan.following = S.scan.following.filter((x) => x.id !== u.id);\n        S.selected.delete(u.id);\n        S.history.unshift({ id: u.id, username: u.username, pic: u.pic, ts: Date.now() });\n        log(`✔ Dejaste de seguir a @${u.username} (${i + 1}/${targets.length})`);\n      } catch (e) {\n        consecutiveErrors++;\n        log(`✖ @${u.username}: ${errText(e)}`);\n        if (isBlock(e) || isAuth(e)) {\n          log('⚠ Instagram está limitando la cuenta. Corto acá; esperá varias horas (idealmente 24 h).');\n          break;\n        }\n        if (consecutiveErrors >= CFG.maxConsecutiveErrors) {\n          log(`⚠ ${consecutiveErrors} errores seguidos. Corto por seguridad.`);\n          break;\n        }\n      }\n      setProgress((i + 1) / targets.length);\n      derive(); renderList(); renderStats();\n      if (i === targets.length - 1) break;\n\n      const elapsed = Date.now() - t0;\n      const remaining = (elapsed / (i + 1)) * (targets.length - i - 1);\n      const isBatchEnd = (i + 1) % CFG.batchSize === 0;\n      const ok = await countdown(\n        isBatchEnd ? CFG.batchPause : jitter(CFG.actionDelay),\n        `${i + 1}/${targets.length} · ${isBatchEnd ? 'pausa larga' : 'próxima'} · ETA ~${fmtDur(remaining)}`\n      );\n      if (!ok) { log('Detenido por vos.'); break; }\n    }\n    saveScan(); saveHistory();\n    setBusy(false);\n    setStatus(`Terminado: ${done} unfollow(s) en ${fmtDur(Date.now() - t0)} · hoy llevás ${dailyUsed()} de ${CFG.dailyMax}`);\n    render();\n  }\n\n  async function refollow(entry) {\n    if (S.busy) return;\n    if (!confirm(`¿Volver a seguir a @${entry.username}?`)) return;\n    setBusy(true);\n    try {\n      await api.follow(entry.id);\n      entry.refollowed = Date.now();\n      saveHistory();\n      log(`✔ Volviste a seguir a @${entry.username}` + (entry.is_private ? ' (solicitud enviada)' : ''));\n    } catch (e) {\n      log(`✖ No pude seguir a @${entry.username}: ${errText(e)}`);\n    } finally { setBusy(false); render(); }\n  }\n\n  function protect(ids) {\n    const byId = new Map(S.lists.nf.map((u) => [u.id, u]));\n    let n = 0;\n    for (const id of ids) {\n      const u = byId.get(id);\n      if (u && !S.whitelist[id]) { S.whitelist[id] = { username: u.username, full_name: u.full_name, pic: u.pic || '', ts: Date.now() }; n++; }\n      S.selected.delete(id);\n    }\n    saveWhitelist();\n    if (n) log(`★ ${n} cuenta(s) agregadas a Protegidos (quedan guardadas aunque vuelvas a escanear).`);\n    render();\n  }\n\n  function unprotect(id) {\n    const name = S.whitelist[id] && S.whitelist[id].username;\n    delete S.whitelist[id];\n    saveWhitelist();\n    log(`☆ @${name} ya no está protegida.`);\n    render();\n  }\n\n  // ───────────────────────────────── Exportar ─────────────────────────────────\n  function download(name, text, type) {\n    const url = URL.createObjectURL(new Blob([text], { type }));\n    const a = Object.assign(document.createElement('a'), { href: url, download: name });\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n  }\n  const csvCell = (v) => `\"${String(v ?? '').replace(/\"/g, '\"\"')}\"`;\n  function exportCurrent(fmt) {\n    const rows = viewRows();\n    if (!rows.length) { log('No hay nada para exportar en esta pestaña.'); return; }\n    const stamp = new Date().toISOString().slice(0, 10);\n    const base = `instagram-${TABS[S.tab].file}-${stamp}`;\n    if (fmt === 'json') {\n      download(base + '.json', JSON.stringify(rows, null, 2), 'application/json');\n    } else {\n      const cols = ['username', 'full_name', 'id', 'is_private', 'is_verified', 'ur  de perfil; si no hay o falla (las URLs de Instagram vencen), muestra la inicial\n  const avatar = (u) => {\n    if (!u.pic || !/^https:\\/\\//.test(u.pic)) return initials(u.username || '');\n    const img = el('img', { className: 'av', src: u.pic, alt: '', loading: 'lazy', decoding: 'async', draggable: false });\n    img.addEventListener('error', () => {\n      img.replaceWith(initials(u.username || ''));\n      if (!avatar.warned) { avatar.warned = true; log('ℹ Algunas fotos no cargaron (Instagram las cambia cada tanto). Tocá Re-escanear para actualizarlas.'); }\n    }, { once: true });\n    return img;\n  };\n\n  function renderStats() {\n    const has = !!S.scan;\n    stFollowers.b.textContent = has ? fmtNum(S.scan.followers.length) : '–';\n    stFollowing.b.textContent = has ? fmtNum(S.scan.following.length) : '–';\n    stNf.b.textContent = has ? fmtNum(S.lists.nf.filter((u) => !S.whitelist[u.id]).length) : '–';\n    subtitle.textContent = has ? `Último escaneo: ${timeAgo(S.scan.ts)}` : 'Sin escanear todavía';\n    const counts = {\n      nf: S.lists.nf.filter((u) => !S.whitelist[u.id]).length,\n      wl: Object.keys(S.whitelist).length,\n    };\n    for (const [k, b] of Object.entries(tabBtns)) {\n      b.classList.toggle('on', k === S.tab);\n      b.lastChild.textContent = fmtNum(counts[k]);\n    }\n  }\n\n  function renderControls() {\n    const nSel = [...S.selected].filter((id) => !S.whitelist[id]).length;\n    const nRun = Math.min(nSel, CFG.maxPerRun);\n    btnScan.disabled = S.busy;\n    btnStop.disabled = !S.busy;\n    btnScan.textContent = S.scan ? 'Re-escanear' : 'Escanear';\n    rowActions.style.display = S.tab === 'nf' ? '' : 'none';\n    btnUnfollow.textContent = nSel > CFG.maxPerRun ? `Dejar de seguir (${nRun} de ${nSel})` : `Dejar de seguir (${nSel})`;\n    btnUnfollow.disabled = S.busy || nSel === 0 || !scanIsFresh();\n    btnUnfollow.title = scanIsFresh() ? '' : 'Requiere un escaneo de menos de 2 h';\n    btnProtect.disabled = S.busy || nSel === 0;\n    const vis = S.tab === 'nf' ? viewRows() : [];\n    const allOn = vis.length > 0 && vis.every((u) => S.selected.has(u.id));\n    const filtered = !!S.query.trim() || S.filter !== 'all';\n    btnAll.disabled = S.busy || !S.scan || vis.length === 0;\n    btnAll.classList.toggle('on', allOn);\n    btnAll.textContent = allOn ? 'Quitar selección'\n      : `${filtered ? 'Seleccionar estos' : 'Seleccionar todos'} (${fmtNum(vis.length)})`;\n    selExport.disabled = S.busy && S.tab === 'nf';\n    listEl.querySelectorAll('input[type=checkbox]').forEach((c) => (c.disabled = S.busy));\n  }\n\n  function renderRow(u) {\n    const link = el('a', { href: `/${u.username}/`, target: '_blank', rel: 'noopener noreferrer', textContent: u.username });\n    const who = el('div', { className: 'who' }, link);\n    if (u.is_verified) who.append(el('span', { className: 'tag v', textContent: 'verificado' }));\n    if (u.is_private) who.append(el('span', { className: 'tag p', textContent: 'privado' }));\n    if (S.tab === 'nf' && lostIds().has(u.id)) who.append(el('span', { className: 'tag lost', textContent: 'te dejó de seguir' }));\n\n    const kids = [];\n    if (S.tab === 'nf') {\n      const cb = el('input', { type: 'checkbox', checked: S.selected.has(u.id), disabled: S.busy, on: {\n        change: (e) => {\n          e.target.checked ? S.selected.add(u.id) : S.selected.delete(u.id);\n          e.target.parentNode.classList.toggle('sel', e.target.checked);\n          renderControls();\n        },\n      } });\n      kids.push(cb);\n      who.append(el('small', { textContent: u.full_name || ' ' }));\n      kids.push(avatar(u), who, el('button', {\n        className: 'star', textContent: '☆', title: 'Proteger (no se va a mostrar ni dejar de seguir)',\n        on: { click: () => protect([u.id]) },\n      }));\n    } else if (S.tab === 'wl') {\n      who.append(el('small', { textContent: u.full_name || 'Protegida' }));\n      kids.push(avatar(u), who, el('button', {\n        className: 'btn sm', textContent: 'Quitar', disabled: S.busy, on: { click: () => unprotect(u.id) },\n      }));\n    } else if (S.tab === 'hist') {\n      if (u.refollowed) who.append(el('span', { className: 'tag ok', textContent: 'seguida de nuevo' }));\n      who.append(el('small', { textContent: `Dejaste de seguir: ${fmtDate(u.ts)}` }));\n      kids.push(avatar(u), who);\n      if (!u.refollowed) {\n        const entry = S.history.find((h) => h.id === u.id && h.ts === u.ts);\n        kids.push(el('button', {\n          className: 'btn sm', textContent: 'Volver a seguir', disabled: S.busy, on: { click: () => entry && refollow(entry) },\n        }));\n      }\n    } else {\n      who.append(el('small', { textContent: u.full_name || ' ' }));\n      kids.push(avatar(u), who);\n    }\n    const item = el('div', { className: 'item' }, kids);\n    if (S.tab === 'nf') {\n      item.classList.add('pick');\n      item.classList.toggle('sel', S.selected.has(u.id));\n      item.addEventListener('click', (e) => {\n        if (S.busy || !panel.classList.contains('full') || e.target.closest('a, button, input')) return;\n        const cb = item.firstChild;\n        cb.checked = !cb.checked;\n        cb.dispatchEvent(new Event('change'));\n      });\n    }\n    return item;\n  }\n\n  function renderList() {\n    const rows = viewRows();\n    listEl.textContent = '';\n    if (!rows.length) {\n      const q = S.query.trim() || S.filter !== 'all';\n      listEl.append(el('div', { className: 'empty', textContent: q ? 'Sin resultados para ese filtro.' : TABS[S.tab].empty }));\n    } else {\n      const frag = document.createDocumentFragment();\n      rows.slice(0, S.limit).forEach((u) => frag.append(renderRow(u)));\n      listEl.append(frag);\n      if (rows.length > S.limit) {\n        listEl.append(el('button', {\n          className: 'btn more', textContent: `Mostrar más (${fmtNum(rows.length - S.limit)} restantes)`,\n          on: { click: () => { S.limit += CFG.renderStep; renderList(); } },\n        }));\n      }\n    }\n    renderControls();\n  }\n\n  function render() { derive(); renderStats(); renderList(); }\n\n  // ─────────────────────────────── Eventos ─────────────────────────────────\n  btnScan.addEventListener('click', scan);\n  btnStop.addEventListener('click', () => { if (S.busy) { S.stop = true; log('Deteniendo…'); } });\n  btnUnfollow.addEventListener('click', runUnfollow);\n  btnProtect.addEventListener('click', () => protect([...S.selected]));\n  function setFull(on, save = true) {\n    panel.classList.toggle('full', on);\n    if (on) { panel.classList.remove('min'); btnMin.textContent = '—'; panel.style.left = panel.style.top = ''; panel.style.right = ''; }\n    btnFull.textContent = on ? '❐' : '⛶';\n    btnFull.title = on ? 'Modo ventana' : 'Pantalla completa';\n    if (save) store.set('full', on);\n  }\n  btnFull.addEventListener('click', () => setFull(!panel.classList.contains('full')));\n  btnMin.addEventListener('click', () => {\n    if (panel.classList.contains('full')) setFull(false, false);\n    panel.classList.toggle('min');\n    btnMin.textContent = panel.classList.contains('min') ? '▢' : '—';\n  });\n  addEventListener('keydown', (e) => {\n    if (e.key === 'Escape' && panel.classList.contains('full') && document.getElementById('nfx-host')) setFull(false);\n  });\n  btnClose.addEventListener('click', () => {\n    if (S.busy && !confirm('Hay una tarea en curso. ¿Detenerla y cerrar?')) return;\n    S.stop = true; host.remove();\n  });\n  let searchTimer;\n  search.addEventListener('input', () => {\n    clearTimeout(searchTimer);\n    searchTimer = setTimeout(() => { S.query = search.value; S.limit = CFG.renderStep; renderList(); }, 150);\n  });\n  selFilter.addEventListener('change', () => { S.filter = selFilter.value; S.limit = CFG.renderStep; renderList(); });\n  selSort.addEventListener('change', () => { S.sort = selSort.value; renderList(); });\n  selExport.addEventListener('change', () => {\n    const v = selExport.value; selExport.value = '';\n    if (v === 'copy') copyCurrent(); else if (v) exportCurrent(v);\n  });\n  btnAll.addEventListener('click', () => {\n    const vis = viewRows();\n    const allOn = vis.length > 0 && vis.every((u) => S.selected.has(u.id));\n    vis.forEach((u) => (allOn ? S.selected.delete(u.id) : S.selected.add(u.id)));\n    if (!allOn && vis.length > CFG.maxPerRun) log(`ℹ Seleccionaste ${vis.length}. Por seguridad se procesan de a ${CFG.maxPerRun} por vez.`);\n    renderList();\n  });\n\n  // Arrastrar el panel desde la cabecera\n  header.addEventListener('pointerdown', (e) => {\n    if (e.target.closest('button') || panel.classList.contains('full')) return;\n    const r = panel.getBoundingClientRect();\n    const dx = e.clientX - r.left, dy = e.clientY - r.top;\n    header.classList.add('drag');\n    header.setPointerCapture(e.pointerId);\n    const move = (ev) => {\n      const x = Math.min(Math.max(0, ev.clientX - dx), innerWidth - r.width);\n      const y = Math.min(Math.max(0, ev.clientY - dy), innerHeight - 48);\n      Object.assign(panel.style, { left: x + 'px', top: y + 'px', right: 'auto' });\n    };\n    const up = () => {\n      header.classList.remove('drag');\n      header.removeEventListener('pointermove', move);\n      header.removeEventListener('pointerup', up);\n    };\n    header.addEventListener('pointermove', move);\n    header.addEventListener('pointerup', up);\n  });\n\n  // Aviso si se cierra la pestaña en medio de un proceso\n  addEventListener('beforeunload', (e) => { if (S.busy && document.getElementById('nfx-host')) { e.preventDefault(); e.returnValue = ''; } });\n\n  // Actualizar el \"hace X min\" periódicamente\n  setInterval(() => { if (document.getElementById('nfx-host') && !S.busy) renderStats(); }, 60e3);\n\n  // ─────────────────────────────── Inicio ──────────────────────────────────\n  setFull(store.get('full', true), false);\n  render();\n  setProgress(0);\n  if (S.scan) {\n    const sinFotos = S.lists.nf.length > 0 && S.lists.nf.every((u) => !u.pic);\n    setStatus(sinFotos ? `Datos del ${fmtDate(S.scan.ts)} sin fotos guardadas. Tocá Re-escanear para verlas.`\n      : `Datos del ${fmtDate(S.scan.ts)} cargados. Re-escaneá para actualizar.`);\n    log(`Panel listo. Escaneo guardado ${timeAgo(S.scan.ts)}.`);\n  } else {\n    setStatus('Listo para escanear.');\n    log('Panel listo. Tocá \"Escanear\".');\n  }\n})();\n";

  const btn = document.getElementById('copy');
  let timer;

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }

  btn.addEventListener('click', async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(CODE); ok = true; }
    catch (_) { try { ok = fallbackCopy(CODE); } catch (_) { ok = false; } }
    clearTimeout(timer);
    btn.className = ok ? 'ok' : 'err';
    btn.textContent = ok ? '¡Copiado!' : 'No se pudo copiar';
    timer = setTimeout(() => { btn.className = ''; btn.textContent = 'Copiar'; }, 1800);
  });
